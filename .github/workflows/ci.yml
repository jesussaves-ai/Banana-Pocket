name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Also build the SD card images (an hour or more)"
        type: boolean
        default: false
      cores_all:
        description: "Build every libretro core (not just the changed ones)"
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libfreetype-dev libdrm-dev libasound2-dev zlib1g-dev imagemagick g++-aarch64-linux-gnu
      - name: banana-ui (headless test, both panel sizes)
        run: make test
      - name: banana-ui with ALSA
        run: make -C ui clean && make -C ui
      - name: bananad (native and aarch64)
        run: |
          make -C system/bananad CFLAGS="-O2 -Werror"
          make -C system/bananad clean
          make -C system/bananad CC=aarch64-linux-gnu-gcc CFLAGS="-O2 -Werror"
      - name: Sleep (bananad against a made-up /sys in its own namespaces)
        run: sudo system/bananad/tests/sleep-test.sh
      - name: Shell scripts parse
        run: for f in system/rootfs/etc/init.d/* system/rootfs/usr/bin/* system/rootfs/usr/libexec/banana/* system/rootfs/etc/banana/sleep.d/* system/tests/*.sh system/bananad/tests/*.sh buildroot/board/retroid-pocket-classic/*.sh tools/*.sh; do sh -n "$f" || exit 1; done
      - name: Buildroot defconfigs keep every option
        run: |
          git clone --depth 1 --branch 2026.02.3 https://github.com/buildroot/buildroot /tmp/br
          for d in banana_retroid_pocket_classic_defconfig; do
            make -s -C /tmp/br BR2_EXTERNAL=$PWD/buildroot O=/tmp/out-$d $d
            grep -E '^BR2_|^# BR2_.* is not set' buildroot/configs/$d | while IFS= read -r l; do
              grep -qxF "$l" /tmp/out-$d/.config || { echo "$d drops: $l"; exit 1; }
            done
          done

  # The libretro cores that changed: a core that stops compiling (a bad pin, an upstream break) should fail on the
  # pull request, not at the next image build. Buildroot builds the real package -- its own download, its .mk, its
  # Makefile/cmake, the aarch64 toolchain -- so this is the whole plumbing, not a re-implementation of it. The
  # toolchain is why it is one job and not a per-core matrix (a matrix leg would rebuild it every time); it is also
  # why the job is gated: it runs only when a core package (or something that decides which cores exist) changed, so
  # most pull requests skip it. Downloads and the compiler cache are shared with the image job.
  cores:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which cores changed
        id: changed
        run: |
          pkgs=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.cores_all }}" = "true" ]; then
            pkgs=all
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"; head="${{ github.sha }}"
            else
              base="${{ github.event.before }}"; head="${{ github.sha }}"
            fi
            files=""
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$base" "$head")
            fi
            # a change to which cores exist, or how they are built, rebuilds them all
            if printf '%s\n' "$files" | grep -qE 'buildroot/(external\.mk|Config\.in|configs/|package/retroarch/)'; then
              pkgs=all
            else
              pkgs=$(printf '%s\n' "$files" | sed -n 's#^buildroot/package/\(libretro-[^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
            fi
          fi
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "cores to build: ${pkgs:-none}"
      - name: Packages
        if: steps.changed.outputs.pkgs != ''
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev unzip rsync cpio file wget python3-dev swig libgnutls28-dev
      - name: Restore downloads
        if: steps.changed.outputs.pkgs != ''
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-cores-${{ github.run_id }}
          restore-keys: dl-
      - name: Restore compiler cache
        if: steps.changed.outputs.pkgs != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-cores-${{ github.run_id }}
          restore-keys: ccache-cores-
      - name: Build the changed cores
        if: steps.changed.outputs.pkgs != ''
        run: |
          make .buildroot/.banana-patched
          make -s -C .buildroot BR2_EXTERNAL="$PWD/buildroot" O="$PWD/output/cores" banana_retroid_pocket_classic_defconfig
          pkgs="${{ steps.changed.outputs.pkgs }}"
          if [ "$pkgs" = all ]; then pkgs="$(cd buildroot/package && ls -d libretro-* | tr '\n' ' ')"; fi
          echo "building: $pkgs"
          for p in $pkgs; do
            echo "::group::$p"
            make -C output/cores "$p"
            echo "::endgroup::"
          done
          echo "cores installed:"; ls -l output/cores/target/usr/lib/libretro/
      - name: Save downloads
        if: always() && steps.changed.outputs.pkgs != ''
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-cores-${{ github.run_id }}
      - name: Save compiler cache
        if: always() && steps.changed.outputs.pkgs != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-cores-${{ github.run_id }}

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      matrix:
        board: [retroid-pocket-classic]
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the toolchain, the kernel, Mesa and RetroArch)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev unzip rsync cpio file wget python3-dev swig libgnutls28-dev
      # downloads and the compiler cache, kept even when the build fails (the next attempt starts from them)
      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'buildroot/package/**') }}
          restore-keys: dl-
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.board }}-
      - name: Build
        run: make ${{ matrix.board }}
      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'buildroot/package/**') }}-${{ matrix.board }}-${{ github.run_id }}
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
      - name: Build log on failure
        if: failure()
        run: tail -n 200 output/${{ matrix.board }}/build/*/.stamp_* 2>/dev/null | tail -n 50; ls -t output/${{ matrix.board }}/build | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: banana-${{ matrix.board }}
          path: |
            output/${{ matrix.board }}/images/banana-${{ matrix.board }}.img.gz
            output/${{ matrix.board }}/images/banana-${{ matrix.board }}-*.update.tar

  # the whole image booted in QEMU: the first boot makes the data partition, the menu comes up, a game is started
  # from the library and the menu comes back, a shutdown from the settings powers the VM off, an A/B update is
  # applied and the other slot booted; the screenshots and the card's logs are kept as an artifact
  boot:
    if: github.event_name == 'workflow_dispatch' && inputs.image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        board: [retroid-pocket-classic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: banana-${{ matrix.board }}
          path: image
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-utils mtools exfatprogs exfat-fuse
      - name: Boot the image in QEMU
        run: sh tools/qemu-boot.sh image/banana-${{ matrix.board }}.img.gz qemu-out
      - name: Serial log on failure
        if: failure()
        run: tail -n 80 qemu-out/serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-${{ matrix.board }}
          path: |
            qemu-out/*.png
            qemu-out/*.log
