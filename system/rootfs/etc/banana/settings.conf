# banana-ui. Copied to /data/banana/settings.conf on the first boot: change it there.
# theme: dark or light (ROCKNIXDS Pixel's two palettes)
theme = dark
# accent: the colour of the selection, the logo and the boot animation's banana (yellow, blue, red, green, purple, pink)
accent = yellow
# motion: off holds the top screen still (no bob), a little less battery
motion = on
# sounds: the menu's sounds
sounds = on
# bgm: an ambient loop under the menu (a WAV on the card: bgm.wav or music/bgm.wav), mixed low so the cues stay clear
bgm = on
# battery: on the top screen, icon or percent (icon and percentage)
battery = icon
# clock: 24h or 12h
clock = 24h
# splash: the boot animation (on), or straight to the menu once it is ready (off)
splash = on
# wifi: on joins the network in banana/wifi.conf at boot; off leaves Wi-Fi down
wifi = on
# sd2_roms: on shows the games on a second SD card (a card in a reader other than the one the system runs from)
# in the library while it's in; off leaves that card alone
sd2_roms = on
# share: the card's data partition on the network over SMB (\\<address>\banana), no password
share = off
# ssh: root over SSH with the keys in banana/ssh/authorized_keys (no passwords), for working on Banana itself
ssh = off
# adb: adb over the network (TCP 5555, `adb connect <address>:5555`), independent of SSH. This adbd has no host key,
# so an open port is an unauthenticated root shell; over the USB cable adb always works
adb = off
# usb_mass_storage: the card's games/saves as a USB disk on the computer over the cable. off: no disk. ro: read-only,
# the computer can copy off the card (the menu keeps running). rw: read-write "transfer mode" -- the menu stops and the
# card is the computer's until you eject it (Settings > System > Mass storage, or `usb-msc off`)
usb_mass_storage = off
# timezone: a POSIX TZ rule (the settings screen lists the common ones; any rule glibc reads works here)
timezone = UTC0
# core.<system>: the RetroArch core for that system when another is installed (Settings > RetroArch). These are
# the defaults systems.conf's run lines use; run-retroarch ignores one whose core isn't installed.
core.gba = gpsp
core.gbc = gambatte
core.gb = gambatte
core.nes = fceumm
core.snes = snes9x
core.megadrive = picodrive
core.psx = swanstation
core.n64 = mupen64plus_next
# boxart_source: libretro, both (TwilightBoxart for libretro's misses) or twilight (TwilightBoxart first);
# boxart_twilight_url: the TwilightBoxart server (KirovAir/TwilightBoxart's API)
boxart_source = libretro
boxart_twilight_url = https://boxart.kirovair.com
# boxart_twilight_key: its API key (public: its web client's), replaced here if the server's changes
boxart_twilight_key = tb2_9f4c1d7a3e8b5062
