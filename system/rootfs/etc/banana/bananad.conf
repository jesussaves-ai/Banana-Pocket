# bananad: sleep, power and hotkeys. /data/banana/bananad.conf overrides these, line by line.
# Minutes without a button press in the menu before sleeping (0: never). Never while a game runs, and never while
# charging. The power button sleeps it at once.
autosleep_minutes = 10
# dim_minutes: in the menu, the panel dimmed to dim_percent after this many idle minutes (0: never); back at a press
dim_minutes = 2
dim_percent = 30
# Hold power this long to shut down
power_long_ms = 2000
# deep: suspend to RAM (days of standby); s2idle: lighter, drains more
mem_sleep = deep
# Asleep, the RTC wakes the handheld this often for a moment to look at the battery (0: never), and it shuts down
# cleanly (the game saves first) when the battery is at or under sleep_poweroff_percent
sleep_check_hours = 4
sleep_poweroff_percent = 5
# Below this while discharging, a sleep is refused when the RTC cannot wake it: the panel just goes dark and the SoC
# stays awake. The RPC's PMIC alarm belongs to the ADSP (no wakealarm), so nothing would wake a sleeping low battery
# and it would drain flat. Ignored on hardware whose RTC has a wakealarm.
sleep_floor_percent = 15
# The mixer control the volume keys change ("auto": the playing card's own), and by how much
mixer = auto
volume_step = 5
# The plug-in pulse length, ms. The PMIC motor's drive is already the driver's maximum for our effect (0xffff
# magnitude), so this is the only knob that changes how the buzz feels.
vibrate_ms = 600
# F + volume: the backlight, in percent of the maximum
brightness_step = 8
# Shut down cleanly at this charge when not on the charger
battery_shutdown_percent = 3
# yes: each sleep's per-device suspend and resume times in banana/logs/sleep-devices.log (finding slow wake-ups)
sleep_debug = no
# Debug only -- leave empty in normal use. A comma list of suspend steps to leave out when hunting a sleep that comes
# straight back: stop (SIGSTOP the game), ui (SIGHUP the menu), mute (panel/codec mute), hooks (sleep.d pre), sync.
# "vib" suppresses the plug-in pulse, to prove the charger edge without buzzing.
# sleep_skip = stop,ui
