# Banana's systems: one [id] section each, in shelf order. The id picks the icon and colour in the theme's
# rnds/systems.cfg (nds, gba, snes...). A copy in /data/banana/systems.conf replaces this file.
#
#   name    shown on the shelf            folder  under /data/roms (default: the id)
#   maker   shown under the name          ext     file extensions that are games
#   run     the command; %ROM% is the game (quoted), %SYSTEM% the id
#   perf    the clock profile while it runs (banana-perf): powersave, balanced, performance
#   always  yes: on the shelf with no games, so a fresh card says where the games go
#   flat    yes: games only in the folder itself, not in its subfolders
#   folder  may also be an absolute path: an app that comes with the system (/usr/share/banana/apps/<id>)

[gba]
name = Game Boy Advance
maker = Nintendo
ext = gba zip
run = /usr/libexec/banana/run-retroarch gpsp %ROM%
perf = balanced

[gbc]
name = Game Boy Color
maker = Nintendo
ext = gbc gb zip
run = /usr/libexec/banana/run-retroarch gambatte %ROM%
perf = powersave

[gb]
name = Game Boy
maker = Nintendo
ext = gb zip
run = /usr/libexec/banana/run-retroarch gambatte %ROM%
perf = powersave

[nes]
name = Nintendo Entertainment System
maker = Nintendo
ext = nes zip
run = /usr/libexec/banana/run-retroarch fceumm %ROM%
perf = powersave

[snes]
name = Super Nintendo
maker = Nintendo
ext = sfc smc zip
run = /usr/libexec/banana/run-retroarch snes9x %ROM%
perf = performance

[megadrive]
name = Genesis
maker = Sega
folder = megadrive
ext = md gen bin smd zip
run = /usr/libexec/banana/run-retroarch picodrive %ROM%
perf = powersave

[sega32x]
name = Sega 32X
maker = Sega
# PicoDrive (the Mega Drive core) runs the 32X too; no BIOS. The 32X is the heavy one of the Sega set, so the clock
# is left high for it.
ext = 32x zip
run = /usr/libexec/banana/run-retroarch picodrive %ROM%
perf = performance

[segacd]
name = Sega CD
maker = Sega
# Genesis Plus GX, the more accurate Mega CD core (the Mega Drive's own shelf is PicoDrive). It needs a Sega CD BIOS
# in banana/bios (RetroArch's system directory): bios_CD_U.bin, bios_CD_E.bin or bios_CD_J.bin for the region.
ext = cue chd iso bin m3u
run = /usr/libexec/banana/run-retroarch genesis_plus_gx %ROM%
perf = balanced

[mastersystem]
name = Master System
maker = Sega
ext = sms zip
run = /usr/libexec/banana/run-retroarch genesis_plus_gx %ROM%
perf = powersave

[gamegear]
name = Game Gear
maker = Sega
ext = gg zip
run = /usr/libexec/banana/run-retroarch genesis_plus_gx %ROM%
perf = powersave

[pcengine]
name = PC Engine
maker = NEC
# HuCard and PC Engine CD, with Beetle PCE Fast. A CD game needs its System Card BIOS in banana/bios (RetroArch's
# system directory): syscard3.pce (Super CD-ROM2) for most, syscard2.pce or syscard1.pce for the older ones. The core
# is software and light; the d-pad and the two face buttons are all a PCE pad has.
ext = pce cue ccd chd m3u
run = /usr/libexec/banana/run-retroarch mednafen_pce_fast %ROM%
perf = powersave

[atari2600]
name = Atari 2600
maker = Atari
# Stella 2014, a software core: a joystick and one button, which is the whole Atari 2600 pad. (The later full Stella
# port is more accurate but heavier; this handheld has no need of it for the 2600.)
ext = a26 bin
run = /usr/libexec/banana/run-retroarch stella2014 %ROM%
perf = powersave

[ngp]
name = Neo Geo Pocket
maker = SNK
# Beetle NeoPop (mednafen_ngp): the Neo Geo Pocket and its Color model. One stick, two buttons and a menu button; no
# BIOS.
ext = ngp ngc ngpc npc
run = /usr/libexec/banana/run-retroarch mednafen_ngp %ROM%
perf = powersave

[wonderswan]
name = WonderSwan
maker = Bandai
# Beetle WonderSwan (mednafen_wswan): the WonderSwan and the Color. Its pad is a d-pad turned 45 degrees; the core
# maps the RetroPad's own onto it. No BIOS.
ext = ws wsc pc2 pcv2
run = /usr/libexec/banana/run-retroarch mednafen_wswan %ROM%
perf = powersave

[atarilynx]
name = Atari Lynx
maker = Atari
# Handy: a software core for the wide Lynx. It needs the Lynx boot ROM in banana/bios (RetroArch's system directory):
# lynxboot.img.
ext = lnx lyx o
run = /usr/libexec/banana/run-retroarch handy %ROM%
perf = powersave

[dreamcast]
name = Dreamcast
maker = Sega
# Flycast needs a Dreamcast BIOS: dc_boot.bin and dc_flash.bin in banana/bios (RetroArch's system directory). Without
# one, turn on the core's "HLE BIOS" option in RetroArch's own Core Options.
ext = chd gdi cdi cue bin dat zip
run = /usr/libexec/banana/run-retroarch flycast %ROM%
perf = performance

[psx]
name = PlayStation
maker = Sony
ext = chd cue bin iso img mdf pbp m3u
run = /usr/libexec/banana/run-retroarch swanstation %ROM%
perf = performance

[n64]
name = Nintendo 64
maker = Nintendo
ext = n64 z64 v64 zip
run = /usr/libexec/banana/run-retroarch mupen64plus_next %ROM%
perf = performance

[c64]
name = Commodore 64
maker = Commodore
# VICE (the x64 machine). A software core; the d-pad and A drive the joystick, and SELECT raises RetroArch's keyboard
# for the games that want a typed command (VICE's own on-screen keyboard is on too). Disk (.d64) and tape (.t64/.tap)
# images load straight from the file; cartridges (.crt) too.
ext = d64 d71 d81 g64 x64 t64 tap prg crt bin zip
run = /usr/libexec/banana/run-retroarch vice_x64 %ROM%
perf = powersave

[zxspectrum]
name = ZX Spectrum
maker = Sinclair
# Fuse (libretro-fuse) loads tapes and snapshots, disks and cartridges: tzx/tap (tapes), z80/sna/szx (snapshots),
# dsk/trd (disks), scl, rzx (recordings), and .zip of any of them. The Spectrum's keyboard is not on this handheld,
# so the d-pad and A/X/Y drive the RetroPad (a Kempston-style pad); SELECT brings up the core's on-screen keyboard for
# the games that need typed commands, and RetroArch's own Controls and Core Options change the pad and the model. The
# Pentagon and Scorpion models need their ROMs in banana/bios/fuse (the core's own system directory); the 48K/128K/+2/
# +3 are built in.
ext = tzx tap z80 rzx scl trd dsk sna szx zip
run = /usr/libexec/banana/run-retroarch fuse %ROM%
perf = powersave


[ports]
name = Ports
maker = PortMaster
ext = sh
run = /usr/libexec/banana/run-port %ROM%
perf = performance
flat = yes
always = yes

