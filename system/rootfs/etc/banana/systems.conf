# Banana's systems: one [id] section each, in shelf order. The id picks the icon and colour in the theme's
# rnds/systems.cfg (nds, gba, snes...). A copy in /data/banana/systems.conf replaces this file.
#
#   name    shown on the shelf            folder  under /data/roms (default: the id)
#   maker   shown under the name          ext     file extensions that are games
#   run     the command; %ROM% is the game (quoted), %SYSTEM% the id
#   perf    the clock profile while it runs (banana-perf): powersave, balanced, performance
#   always  yes: on the shelf with no games, so a fresh card says where the games go
#   flat    yes: games only in the folder itself, not in its subfolders
#   folder  may also be an absolute path: an app that comes with the system (/usr/share/banana/apps/<id>)

[gba]
name = Game Boy Advance
maker = Nintendo
ext = gba zip
run = /usr/libexec/banana/run-retroarch gpsp %ROM%
perf = balanced

[gbc]
name = Game Boy Color
maker = Nintendo
ext = gbc gb zip
run = /usr/libexec/banana/run-retroarch gambatte %ROM%
perf = powersave

[gb]
name = Game Boy
maker = Nintendo
ext = gb zip
run = /usr/libexec/banana/run-retroarch gambatte %ROM%
perf = powersave

[nes]
name = Nintendo Entertainment System
maker = Nintendo
ext = nes zip
run = /usr/libexec/banana/run-retroarch fceumm %ROM%
perf = powersave

[snes]
name = Super Nintendo
maker = Nintendo
ext = sfc smc zip
run = /usr/libexec/banana/run-retroarch snes9x %ROM%
perf = performance

[megadrive]
name = Genesis
maker = Sega
folder = megadrive
ext = md gen bin smd zip
run = /usr/libexec/banana/run-retroarch picodrive %ROM%
perf = powersave

[mastersystem]
name = Master System
maker = Sega
ext = sms zip
run = /usr/libexec/banana/run-retroarch genesis_plus_gx %ROM%
perf = powersave

[gamegear]
name = Game Gear
maker = Sega
ext = gg zip
run = /usr/libexec/banana/run-retroarch genesis_plus_gx %ROM%
perf = powersave

[dreamcast]
name = Dreamcast
maker = Sega
# Flycast needs a Dreamcast BIOS: dc_boot.bin and dc_flash.bin in banana/bios (RetroArch's system directory). Without
# one, turn on the core's "HLE BIOS" option in RetroArch's own Core Options.
ext = chd gdi cdi cue bin dat zip
run = /usr/libexec/banana/run-retroarch flycast %ROM%
perf = performance

[psx]
name = PlayStation
maker = Sony
ext = chd cue bin iso img mdf pbp m3u
run = /usr/libexec/banana/run-retroarch swanstation %ROM%
perf = performance

[n64]
name = Nintendo 64
maker = Nintendo
ext = n64 z64 v64 zip
run = /usr/libexec/banana/run-retroarch mupen64plus_next %ROM%
perf = performance

[zxspectrum]
name = ZX Spectrum
maker = Sinclair
# Fuse (libretro-fuse) loads tapes and snapshots, disks and cartridges: tzx/tap (tapes), z80/sna/szx (snapshots),
# dsk/trd (disks), scl, rzx (recordings), and .zip of any of them. The Spectrum's keyboard is not on this handheld,
# so the d-pad and A/X/Y drive the RetroPad (a Kempston-style pad); SELECT brings up the core's on-screen keyboard for
# the games that need typed commands, and RetroArch's own Controls and Core Options change the pad and the model. The
# Pentagon and Scorpion models need their ROMs in banana/bios/fuse (the core's own system directory); the 48K/128K/+2/
# +3 are built in.
ext = tzx tap z80 rzx scl trd dsk sna szx zip
run = /usr/libexec/banana/run-retroarch fuse %ROM%
perf = powersave


[ports]
name = Ports
maker = PortMaster
ext = sh
run = /usr/libexec/banana/run-port %ROM%
perf = performance
flat = yes
always = yes

