# Banana: WirePlumber/ACP settings for the AudioReach (q6apm) card.
#
# 1. Never idle-suspend the ALSA nodes (session.suspend-timeout-seconds = 0). This DSP latches the routing when a
#    graph is instantiated and clears the front-end->back-end switch when the graph is torn down (there is no event
#    for "the graph stopped"), so a node that suspends and resumes comes back unrouted -- silence. It is why the menu
#    used to hold its own stream open forever. The sink staying open is that one open.
#
# 2. Give q6apm a larger ring buffer. ACP's default probe is tiny (the log shows
#    `snd_pcm_hw_params_set_buffer_size_near() failed: Invalid argument` for every device, then a period the graph
#    accepts), and the menu writes 15 ms cue bursts: too little behind the DSP is what makes the cues sound crusty.
#    headroom keeps a period of slack so a scheduling delay does not underrun the front end.
monitor.alsa.properties = {
    session.suspend-timeout-seconds = 0
    api.alsa.headroom = 1024
    api.alsa.period-size = 1024
}
