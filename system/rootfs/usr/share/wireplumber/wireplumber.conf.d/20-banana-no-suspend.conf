# Banana: never idle-suspend the ALSA nodes.
#
# This card's DSP latches the routing and the levels when a graph is instantiated, and there is no event for "the
# graph stopped": a node that suspends and resumes comes back with the route switches off and the amplifiers never
# start -- silence. It is why the menu used to hold its own stream open forever ("while the device is open the stream
# never stops"), and why a game's first open after a quiet spell failed. With the sound server the *sink* is that one
# open, so it has to stay open: 0 means the node is never suspended (see scripts/node/suspend-node.lua, which honors
# this node property), instead of the 5 s default.
monitor.alsa.properties = {
    session.suspend-timeout-seconds = 0
}
