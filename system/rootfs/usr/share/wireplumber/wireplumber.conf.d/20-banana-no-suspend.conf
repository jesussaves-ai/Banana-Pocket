# Banana: WirePlumber/ACP settings for the AudioReach (q6apm) card.
#
# 1. Never idle-suspend the ALSA nodes (session.suspend-timeout-seconds = 0). This DSP latches the routing when a
#    graph is instantiated and clears the front-end->back-end switch when the graph is torn down (there is no event
#    for "the graph stopped"), so a node that suspends and resumes comes back unrouted -- silence. It is why the menu
#    used to hold its own stream open forever. The sink staying open is that one open.
#
# 2. q6apm-safe buffering on the UCM sinks. monitor.alsa.properties does NOT reach the ACP-created nodes -- measured
#    on the unit, the Speaker sink kept api.alsa.period-size=480, api.alsa.period-num=8 and api.alsa.headroom=480
#    (the SPA defaults, not our 1024), so the menu's 15 ms cue bursts underran the DMA ring and crackled. The props
#    are set per node instead, matched on node.name (the SPA key is api.alsa.period-num, not api.alsa.periods).
monitor.alsa.properties = {
    session.suspend-timeout-seconds = 0
}

monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
                api.alsa.period-size = 1024
                api.alsa.period-num = 4
                api.alsa.headroom = 1024
            }
        }
    }
]
