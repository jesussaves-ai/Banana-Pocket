# Retroid Pocket Classic (SM4450) UCM2 profile, as ROCKNIX ships it
# (projects/ROCKNIX/devices/SM4450/filesystem/usr/share/alsa/ucm2), BSD-3-Clause. Banana carries it so a UCM-aware
# opener -- alsaucm, or PipeWire's ACP -- can set this card's routes and levels itself, instead of the amixer
# writes Banana makes by hand today.

# HiFi use case for the Retroid Pocket Classic

SectionVerb {
	EnableSequence [
		cset "name='SENARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	# Banana: no DisableSequence. On this card the DSP's graph is routed once and stays routed (rcS set these
	# before the menu started, long before any profile manager existed): a deactivation that turned them off would
	# leave the next graph -- the menu's cue, a game -- unrouted and silent, because nothing re-runs the enable.

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# No EnableSequence: the FE<->BE switch is the verb's (SectionVerb.EnableSequence), as Banana's UCM rule says
	# -- a device-level copy would only be a second writer of the same shared switch.

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	# No EnableSequence: the codec path's FE<->BE switch is the verb's (SectionVerb.EnableSequence). The Includes
	# above are the physical endpoint (the WCD937x switches and the RX macro muxes), which stay per-device.

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		PlaybackChannels 2
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}
