# Banana: the Wii Remote profile for the 6-button faceplate variant, written to the card's
# /data/dolphin-emu/Config/WiimoteNew.ini by run-dolphin when pad-profile reports a pad that advertises C and Z
# (WiimoteNew.ini is the standard 4-button profile). The variant adds the two extra face buttons the MCU's key bitmap
# reserves, and Dolphin numbers a pad's buttons in evdev key-code order -- so BTN_C (306) and BTN_Z (309) land between
# the existing ones and every button above them shifts by two. Starting from the 4-button profile, the indices become
# BACK(0), SOUTH(1), EAST(2), C(3), NORTH(4), WEST(5), Z(6), TL(7), TR(8), TL2(9), TR2(10), SELECT(11), START(12),
# MODE(13), THUMBL(14), THUMBR(15), D-pad(16..19). The pad is otherwise the same, so the mapping keeps the same shape:
# A/B/X/Y play the same buttons, and the shake stays on R1 (now Button 8). C and Z are left free for a game that has
# something to put on them.
[Wiimote1]
Device = evdev/0/Retroid Pocket Classic Gamepad
Source = 1
Extension = None
Options/Sideways Wiimote = True
Buttons/2 = Button 2
Buttons/1 = Button 1
Buttons/A = Button 4
Buttons/B = Button 5
Buttons/- = Button 11
Buttons/+ = Button 12
Buttons/Home = Button 13
D-Pad/Up = Button 16
D-Pad/Down = Button 17
D-Pad/Left = Button 18
D-Pad/Right = Button 19
Shake/X = Button 8
Shake/Y = Button 8
Shake/Z = Button 8
