# Banana: Dolphin's graphics configuration for the Retroid Pocket Classic (copied to the card's
# /data/dolphin-emu/Config/GFX.ini by run-dolphin on the first Wii game). The console is a 480p machine and the a613
# is the floor for it, so this renders at the console's own resolution and spends nothing on extras:
#
#   EFBScale                   1 = native (640x528). The panel scales the 4:3 picture up; rendering above native
#                              costs frame rate the GPU does not have.
#   MSAA / SSAA                off (the cheapest win there is).
#   ShaderCompilationMode      0 = synchronous. The a613 is the bottleneck and ubershaders (1/2) are expensive pixel
#                              shaders drawn for every fragment while the game's real (small) one compiles;
#                              synchronous draws that shader. It hitches the first time a new one appears (a cold
#                              shader cache) but holds a higher frame rate -- measured on the unit: ~52 fps with 0
#                              against ~45 with 2 (async ubershaders). ROCKNIX ships 0 for this SoC.
#   WaitForShadersBeforeStarting  on, pairing with the synchronous mode: precompile before the first frame.
#   EnableGPUTextureDecoding   off: CPU decoding is the safer path on a driver this young, and the game is not
#                              GPU-bound on the CPU side.
#
# The hacks are ROCKNIX's for this SoC: EFB/XFB kept in texture memory (the fast path; a game that reads the
# framebuffer from the CPU wants EFBAccessEnable turned on in the menu), and ForceProgressive on.
[Hardware]
VSync = False
Adapter = 0

[Settings]
# 2 = ForceStandard, Dolphin's 4:3 (0 = Auto follows each game, which is 16:9 for most Wii titles; 1 = ForceWide,
# 3 = Stretch). The panel is closer to 4:3 than to 16:9, so a 16:9 Wii game is pillarboxed instead of squeezed.
AspectRatio = 2
Crop = False
wideScreenHack = False
UseXFB = False
UseRealXFB = False
SafeTextureCacheColorSamples = 128
ShowFPS = False
EFBScale = 1
MSAA = 0
SSAA = False
ShaderCompilationMode = 0
WaitForShadersBeforeStarting = True
BackendMultithreading = True
EnableGPUTextureDecoding = False
EnablePixelLighting = False
FastDepthCalc = True
DisableFog = False

[Hacks]
EFBAccessEnable = False
BBoxEnable = False
ForceProgressive = True
EFBToTextureEnable = True
EFBScaledCopy = False
EFBEmulateFormatChanges = False
SkipDuplicateXFBs = True
XFBToTextureEnable = False
