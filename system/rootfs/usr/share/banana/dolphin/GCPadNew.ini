# Banana: the GameCube pad profile, for the standard 4-button faceplate. A Wii game does not read this pad; the nogui
# hotkey handler does (Dolphin's patched nogui MainLoop reads GameCube pad 0 and acts while MODE is held), so it is
# what makes quit, save state, load state, screenshot and the rest work from the handheld. run-dolphin copies it to
# the card's /data/dolphin-emu/Config/GCPadNew.ini. Button numbers are the same evdev ordering as the Wiimote
# profile: BACK(0), SOUTH(1), EAST(2), NORTH(3), WEST(4), TL(5), TR(6), TL2(7), TR2(8), SELECT(9), START(10), MODE(11),
# THUMBL(12), THUMBR(13), d-pad(14..17).
[GCPad1]
Device = evdev/0/Retroid Pocket Classic Gamepad
Buttons/Hotkey = Button 11
Buttons/Start = Button 10
Buttons/A = Button 2
Buttons/B = Button 1
Buttons/X = Button 3
Buttons/Y = Button 4
Buttons/Z = Button 8
Triggers/L = Button 5
Triggers/R = Button 6
D-Pad/Up = Button 14
D-Pad/Down = Button 15
D-Pad/Left = Button 16
D-Pad/Right = Button 17
