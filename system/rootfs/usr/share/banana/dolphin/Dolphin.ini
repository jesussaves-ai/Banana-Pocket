# Banana: Dolphin's main configuration for the Retroid Pocket Classic. run-dolphin copies it into the card's config
# directory (/data/dolphin-emu/Config/Dolphin.ini) the first time a Wii game starts; after that the card's copy is
# the one that counts and Dolphin writes it back when it quits. The keys that matter to this handheld:
#
#   GFXBackend   Vulkan (the a613 through Mesa's Turnip); run-dolphin falls back to OGL on a machine without Turnip.
#   Backend      ALSA. The image has no PulseAudio or Cubeb, and bananad routes the ALSA "default" device (the
#                WCD937x codec with the two AW88166 amplifiers) before the game opens it.
#   CPUCore      4 = JITARM64, the dynamic recompiler (0/5 are the interpreters).
#
# The rest are ROCKNIX's for this SoC, minus what this image does not have.
[General]
ISOPath0 = /data/roms/wii
ISOPaths = 1
RecursiveISOPaths = True

[Interface]
ConfirmStop = False
UsePanicHandlers = False
OnScreenDisplayMessages = True
ShowToolbar = False
ShowStatusbar = False

[Display]
Fullscreen = True
BorderlessFullscreen = True
RenderToMain = False

[Core]
GFXBackend = Vulkan
CPUCore = 4
Fastmem = True
CPUThread = True
DSPHLE = True
SkipIdle = True
SyncGPU = False
EnableCheats = False
WiiSDCard = False
WiimoteEnableSpeaker = False
EmulationSpeed = 1.00000000
FrameSkip = 3
Overclock = 1.0
OverclockEnable = False

[DSP]
Backend = ALSA
Volume = 100
DSPThread = True
EnableJIT = True

[Analytics]
Enabled = False
PermissionAsked = True
