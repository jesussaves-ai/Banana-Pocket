# Banana: the Wii Remote profile for the standard 4-button faceplate, written to the card's
# /data/dolphin-emu/Config/WiimoteNew.ini by run-dolphin (the 6-button variant is WiimoteNew.6button.ini; the pad is
# told apart by pad-profile). The Remote is held sideways -- the shape the light platformers (New Super Mario Bros.
# Wii, the Kirby titles, Donkey Kong Country Returns, Wario Land) expect -- so the d-pad and the 1/2 buttons play,
# and a shoulder stands in for the shake the handheld has no gyro for.
#
#   Device    the handheld's own pad. Dolphin names an evdev device <backend>/<id>/<evdev name>, and the name here is
#             the one the rsinput driver reports (also Banana's autoconfig's). The pad is the only device with that
#             name, so its id is 0.
#   Buttons   Dolphin numbers a pad's buttons in evdev key-code order, and this pad's are BTN_BACK(0), SOUTH(1),
#             EAST(2), NORTH(3), WEST(4), TL(5), TR(6), TL2(7), TR2(8), SELECT(9), START(10), MODE(11), THUMBL(12),
#             THUMBR(13), then the d-pad (14..17). Banana's A is BTN_EAST (2) and B is BTN_SOUTH (1).
#   Shake     R1 (Button 6). The core's shake is the accelerometer triplet Shake/X,Y,Z; one button drives all three,
#             so a single shoulder shake stands in for a physical one. L1, L2 and R2 are left free for the game or
#             the user.
[Wiimote1]
Device = evdev/0/Retroid Pocket Classic Gamepad
Source = 1
Extension = None
Options/Sideways Wiimote = True
Buttons/2 = Button 2
Buttons/1 = Button 1
Buttons/A = Button 3
Buttons/B = Button 4
Buttons/- = Button 9
Buttons/+ = Button 10
Buttons/Home = Button 11
D-Pad/Up = Button 14
D-Pad/Down = Button 15
D-Pad/Left = Button 16
D-Pad/Right = Button 17
Shake/X = Button 6
Shake/Y = Button 6
Shake/Z = Button 6
